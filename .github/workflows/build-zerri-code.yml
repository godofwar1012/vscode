name: Build Zerri Code (Windows x64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Zerri Code Release (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Zerri Core (Native Rust Daemon)
        shell: pwsh
        run: |
          Write-Host "Compiling native zerri-core in release mode..."
          cd src/zerri-core
          cargo build --release
          if (Test-Path "target/release/zerri-core.exe") {
            Write-Host "zerri-core.exe compiled successfully!"
          } else {
            Write-Error "zerri-core.exe compilation failed"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          node build/npm/preinstall.ts
          npm ci --force

      - name: Compile Zerri Code Distribution
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64

      - name: Bundle Zerri Native Core into Distribution
        shell: pwsh
        run: |
          $dist = Resolve-Path "..\VSCode-win32-x64"
          $rustBin = Resolve-Path "src\zerri-core\target\release\zerri-core.exe"
          if (Test-Path $dist) {
            Copy-Item $rustBin -Destination "$dist\zerri-core.exe" -Force
            New-Item -ItemType Directory -Path "$dist\resources\app\src\zerri-core\target\release" -Force
            Copy-Item $rustBin -Destination "$dist\resources\app\src\zerri-core\target\release\zerri-core.exe" -Force
            Write-Host "zerri-core.exe bundled into distribution!"
          } else {
            Write-Warning "Could not find distribution folder at $dist"
          }

      - name: Compress Zerri Code Distribution
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "..\VSCode-win32-x64"
          if (Test-Path $buildDir) {
            Compress-Archive -Path "$buildDir\*" -DestinationPath "zerri-code-win32-x64.zip" -CompressionLevel Optimal
            Write-Host "Archive created: zerri-code-win32-x64.zip"
          } else {
            Write-Error "Distribution directory not found"
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerri-code-windows-x64
          path: zerri-code-win32-x64.zip
          retention-days: 14
